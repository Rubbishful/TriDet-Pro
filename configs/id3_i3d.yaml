dataset_name: thumos
train_split: [ 'validation' ]
val_split: [ 'test' ]
dataset: {
  json_file: data/id3_2048/annotations.json,
  feat_folder: data/id3_2048,
  file_prefix: ~,
  file_ext: .npy,
  num_classes: 20,
  input_dim: 2048,
  feat_stride: 4,
  num_frames: 16,
  default_fps: 25,
  downsample_rate: 1,
  trunc_thresh: 0.5,
  crop_ratio: [ 0.9, 1.0 ],
  max_seq_len: 128,
}
model: {
  fpn_type: identity,
  backbone_type: SGP,
  downsample_type: max,
  scale_factor: 2,
  max_buffer_len_factor: 6.0,
  backbone_arch: [ 2, 2, 5 ],
  n_sgp_win_size: 1,
  embd_dim: 512,
  embd_kernel_size: 3,
  embd_with_ln: True,
  fpn_dim: 512,
  fpn_with_ln: True,
  head_dim: 512,
  head_kernel_size: 3,
  head_num_layers: 3,
  head_with_ln: True,
  use_abs_pe: False,
  init_conv_vars: 0,
  regression_range: [ [ 0, 4 ], [ 4, 8 ], [ 8, 16 ], [ 16, 32 ], [ 32, 64 ], [ 64, 10000 ] ],
  num_bins: 16,
  k: 5,
  iou_weight_power: 0.2,
  use_trident_head: True,
  sgp_mlp_dim: 768,
  input_noise: 0.0005,
}
opt: {
  learning_rate: 0.0001,
  warmup_epochs: 20,
  epochs: 20,
  weight_decay: 0.025,
}
loader: {
  batch_size: 1,
}
train_cfg: {
  init_loss_norm: 100,
  clip_grad_l2norm: 1.0,
  cls_prior_prob: 0.01,
  center_sample: radius,
  center_sample_radius: 1.5,
  droppath: 0.1,
}
test_cfg: {
  voting_thresh: 0.7,
  pre_nms_topk: 2000,
  max_seg_num: 2000,
  min_score: 0.001,
  multiclass_nms: True,
  nms_sigma: 0.5,
  nms_method: soft,
  duration_thresh: 0.05,
  iou_threshold: 0.1,
}
output_folder: ./ckpt/

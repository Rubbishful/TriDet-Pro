dataset_name: thumos
train_split: [validation]
val_split: [test]
dataset:
  json_file: ./data/thumos/annotations/thumos14.json
  feat_folder: ./data/thumos/i3d_features
  file_prefix: null
  file_ext: .npy
  num_classes: 20
  input_dim: 2048
  feat_stride: 4
  num_frames: 16
  trunc_thresh: 0.5
  crop_ratio: [0.9, 1.0]
  max_seq_len: 2304
  default_fps: null
  downsample_rate: 1
  force_upsampling: false
model:
  fpn_type: identity
  max_buffer_len_factor: 6.0
  backbone_arch: [2, 2, 5]
  n_sgp_win_size: 3
  regression_range: [[0, 4], [4, 8], [8, 16], [16, 32], [32, 64], [64, 10000]]
  num_bins: 16
  k: 5
  iou_weight_power: 0.2
  use_trident_head: true
  sgp_mlp_dim: 768
  input_noise: 0.0005
  backbone_type: SGP
  scale_factor: 2
  embd_kernel_size: 3
  embd_dim: 512
  embd_with_ln: true
  fpn_dim: 512
  fpn_with_ln: true
  head_dim: 512
  head_kernel_size: 3
  boundary_kernel_size: 3
  head_num_layers: 3
  head_with_ln: true
  use_abs_pe: false
  downsample_type: max
  init_conv_vars: 0
  input_dim: 2048
  num_classes: 20
  max_seq_len: 2304
  train_cfg: &id001
    init_loss_norm: 100
    clip_grad_l2norm: 1.0
    cls_prior_prob: 0.01
    center_sample: radius
    center_sample_radius: 1.5
    loss_weight: 1.0
    loss_type: diou
    head_empty_cls: []
    dropout: 0.0
    droppath: 0.1
    label_smoothing: 0.0
  test_cfg: &id002
    voting_thresh: 0.7
    pre_nms_topk: 2000
    max_seg_num: 2000
    min_score: 0.001
    multiclass_nms: true
    pre_nms_thresh: 0.001
    iou_threshold: 0.1
    nms_method: soft
    nms_sigma: 0.5
    duration_thresh: 0.05
    ext_score_file: null
opt:
  learning_rate: 0.0001
  warmup_epochs: 20
  epochs: 20
  weight_decay: 0.025
  type: AdamW
  momentum: 0.9
  warmup: true
  schedule_type: cosine
  eta_min: 1.0e-08
  schedule_steps: []
  schedule_gamma: 0.1
loader:
  batch_size: 2
  num_workers: 0
train_cfg: *id001
test_cfg: *id002
output_folder: ./ckpt/
init_rand_seed: 1234567891
devices: ['cuda:0']
model_name: TriDet

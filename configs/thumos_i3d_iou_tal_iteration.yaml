# ============================================================================
# THUMOS14 I3D + IoU Head + Task-Aligned Assigner (TAL)
#
# 对应消融实验 #4: TAL + IoU Head (完整方案)
# 基于 thumos_i3d.yaml 基准配置，启用全部新增改进。
#
# 使用方法:
#   训练:
#     python train.py configs/thumos_i3d_iou_tal.yaml
#
#   评估 (使用训练好的 checkpoint):
#     python eval.py configs/thumos_i3d_iou_tal.yaml --ckpt ckpt/<model_dir>/best.pth.tar
#
# 消融实验:
#   #1 Baseline:    直接用 thumos_i3d.yaml
#   #2 TAL only:     改 use_iou_head: False, tal_topk: 13
#   #3 IoU only:     改 use_iou_head: True,  tal_topk: 0
#   #4 TAL + IoU:    当前文件 (默认)
#   #5 关 IoU-Aware: 改 iou_weight_power: 0
# ============================================================================

dataset_name: thumos
train_split: [ 'validation' ]
val_split: [ 'test' ]
dataset: {
  json_file: D:/Code/THUMOS14/thumos/annotations/thumos14.json,
  feat_folder: D:/Code/THUMOS14/thumos/i3d_features,
  file_prefix: ~,
  file_ext: .npy,
  num_classes: 20,
  input_dim: 2048,
  feat_stride: 4,
  num_frames: 16,
  trunc_thresh: 0.5,
  crop_ratio: [ 0.9, 1.0 ],
  max_seq_len: 2304,
}
model: {
  fpn_type: identity,
  max_buffer_len_factor: 6.0,
  backbone_arch: [ 2, 2, 5 ],
  n_sgp_win_size: 1,
  regression_range: [ [ 0, 4 ], [ 4, 8 ], [ 8, 16 ], [ 16, 32 ], [ 32, 64 ], [ 64, 10000 ] ],
  num_bins: 16,
  k: 5,
  iou_weight_power: 0.2,
  use_trident_head: True,
  sgp_mlp_dim: 768,
  input_noise: 0.0005,

  # ====== IoU Prediction Head ======
  use_iou_head: True,        # 启用 IoU 预测分支
  iou_head_dim: 512,         # IoU 头隐藏层维度
  iou_head_layers: 2,        # IoU 头层数 (Round 2 optimal)
  iou_loss_type: bce,         # IoU loss 类型: bce | qfl
  iou_loss_weight: 0.1,      # IoU loss 权重 (Round 2 optimal)
  iou_qfl_beta: 2.0,         # QFL 调制因子 (仅 iou_loss_type=qfl 时生效)
  iou_warmup_epochs: 5,      # IoU loss 预热 (epoch 数)
  iou_per_level: False,       # 每 FPN level 独立 IoU head (Round 2: False better)
  iou_head_residual: True,    # IoU head 残差连接 (Round 2 optimal)

  # ====== Task-Aligned Assigner ======
  tal_topk: 0,              # 每个 GT 保留的正样本数 (>0 启用 TAL)
  tal_alpha: 1.0,            # alignment 中分类分数的指数
  tal_beta: 4.0,             # alignment 中 IoU 的指数
  tal_start_epoch: 5,        # TAL 启动 epoch (0-indexed, 即第 6 个 epoch 开始)
}
opt: {
  learning_rate: 0.0001,
  warmup_epochs: 20,
  epochs: 60,
  weight_decay: 0.025,
}
loader: {
  batch_size: 2,
  num_workers: 4,
}
train_cfg: {
  init_loss_norm: 100,
  clip_grad_l2norm: 1.0,
  cls_prior_prob: 0.01,
  center_sample: radius,
  center_sample_radius: 1.5,
  use_amp: True,
}
test_cfg: {
  voting_thresh: 0.7,
  pre_nms_topk: 2000,
  max_seg_num: 2000,
  min_score: 0.001,
  multiclass_nms: True,
}
output_folder: ./ckpt/

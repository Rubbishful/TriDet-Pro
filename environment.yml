name: tridet
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Core
  - python=3.9
  - pip
  # Scientific computing
  - numpy>=1.21,<1.25
  - scipy>=1.8
  - pandas>=1.4
  - h5py>=3.7
  # Machine learning (pip: PyTorch with CUDA 11.8)
  - pip:
      - torch==2.0.1+cu118
      - torchvision==0.15.2+cu118
      - --index-url https://download.pytorch.org/whl/cu118
  # Visualization
  - matplotlib>=3.5
  - opencv-python>=4.10
  # Utilities
  - pyyaml>=6.0
  - scikit-learn>=1.2
  - joblib>=1.1
  - setuptools>=58.0
